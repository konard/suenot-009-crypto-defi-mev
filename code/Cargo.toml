[package]
name = "crypto-defi-mev"
version = "0.1.0"
edition = "2021"
description = "DeFi protocols, AMMs, MEV strategies and on-chain risk for algorithmic trading"
license = "MIT"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
rayon = "1.8"
thiserror = "1.0"
ethereum-types = "0.14"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
approx = "0.5"

[[bench]]
name = "amm_benchmark"
harness = false

[[bench]]
name = "arbitrage_benchmark"
harness = false

[profile.release]
lto = true
codegen-units = 1
